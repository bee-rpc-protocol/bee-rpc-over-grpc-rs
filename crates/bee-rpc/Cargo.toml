[package]
name = "bee-rpc"
description = "Bee-RPC over gRPC: move buffers of any size, in blocks, with a hash per block"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[features]
default = []
# The generic bidi call over tonic (src/grpc.rs) and the interop test.
grpc = ["dep:tonic", "dep:tonic-prost", "dep:tokio", "dep:tokio-stream"]

[dependencies]
blake2 = "0.11"
prost = "0.14"
sha2 = "0.11"
sha3 = "0.12"
thiserror = "2"
tonic = { version = "0.14", optional = true }
tonic-prost = { version = "0.14", optional = true }
tokio = { version = "1", optional = true, features = ["sync", "rt", "time"] }
tokio-stream = { version = "0.1", optional = true }

[dev-dependencies]
hex = "0.4"
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time", "process", "io-util"] }
